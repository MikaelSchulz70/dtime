spring:
  # Database Configuration for Docker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://host.docker.internal:5432/dtime}
    username: ${DATABASE_USERNAME:dtime}
    password: ${DATABASE_PASSWORD:dtime_dev_password}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: dtime
        jdbc:
          lob:
            non_contextual_creation: true

  # Liquibase Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog.xml
    url: ${DATABASE_URL:jdbc:postgresql://host.docker.internal:5432/dtime}
    user: ${DATABASE_USERNAME:dtime}
    password: ${DATABASE_PASSWORD:dtime_dev_password}

  # Mail Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    transport:
      protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: false

# Server Configuration (HTTPS enabled for production)
server:
  port: 8443
  address: 0.0.0.0
  ssl:
    key-store-type: PKCS12
    key-store: classpath:keystore/dtime_new.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:dt2020}
    key-alias: dtime
  servlet:
    session:
      cookie:
        name: JSESSIONID
        secure: false  # Allow session cookies over HTTP for dev
        http-only: false  # Allow JavaScript access for debugging
        same-site: lax  # Allow cross-site requests for development

# Security Configuration
security:
  enable-csrf: ${SECURITY_CSRF_ENABLED:false}

# Authentik OIDC (values from .env / compose). Server-side URLs default to host.docker.internal
# so machine JWT JWKS fetch works from inside the container (localhost in .env is for IntelliJ on the host).
oauth:
  authentik:
    enabled: ${OAUTH_AUTHENTIK_ENABLED:false}
    end-session-uri: ${OAUTH_AUTHENTIK_END_SESSION_URI:}
    token-uri: ${OAUTH_AUTHENTIK_TOKEN_URI:http://host.docker.internal:9000/application/o/token/}
    user-info-uri: ${OAUTH_AUTHENTIK_USER_INFO_URI:http://host.docker.internal:9000/application/o/userinfo/}
    jwk-set-uri: ${OAUTH_AUTHENTIK_JWK_SET_URI:http://host.docker.internal:9000/application/o/dtime/jwks/}
    machine-jwt:
      enabled: ${OAUTH_AUTHENTIK_MACHINE_JWT_ENABLED:false}
      jwk-set-uri: ${OAUTH_AUTHENTIK_MACHINE_JWT_JWK_SET_URI:http://host.docker.internal:9000/application/o/dtmcp/jwks/}

# Email Configuration
mail:
  enabled: ${MAIL_ENABLED:false}
  username: ${MAIL_USERNAME:dummy@example.com}
  password: ${MAIL_PASSWORD:dummy-password}

# Application Configuration
dtime:
  hours_per_day: 8
  system:
    start-date: 2025-01-01

# When the SPA runs on https://localhost:3000 and the backend is on :8443, OIDC callbacks
# and switch-user must return to the SPA origin (see CustomAuthenticationSuccessHandler).
app:
  frontend:
    dev-server:
      enabled: true
      url: https://localhost:3000

# Logging Configuration
logging:
  level:
    org.springframework.web: INFO
    web: INFO
    se.dtime: INFO
  file:
    name: /app/logs/server.log

# Management endpoints for health checks
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false
    diskspace:
      enabled: false