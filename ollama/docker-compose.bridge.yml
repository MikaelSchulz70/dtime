# Ollama MCP bridge — included from repo root together with docker-compose.yml.
#
# Ollama: native on host (host.docker.internal:11434). MCP + bridge: Docker (dtime-mcp, dtime-ollama-bridge).
# Default BRIDGE_MCP_CONFIG=bridge-config.json → http://dtime-mcp:8081/mcp

services:
  dtime-ollama-bridge:
    image: ghcr.io/jonigl/ollama-mcp-bridge:v0.11.2
    container_name: dtime-ollama-bridge
    restart: unless-stopped
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      CORS_ORIGINS: ${OLLAMA_BRIDGE_CORS_ORIGINS:-http://localhost:3000,https://localhost:3000}
      SYSTEM_PROMPT: "${OLLAMA_BRIDGE_SYSTEM_PROMPT:-DTime admin assistant. Use dtime MCP tools only; never invent data. User count: getUserCount. Org hours/reports: getReport only — omit year/month for current period; prefer type=USER_TASK (task breakdown + org totals), type=USER for totals only, type=TASK|ACCOUNT for aggregates. One user's total: getReport type=USER, filter userReports — not getUserTimeReportForMonth. Lists: getPagedUsers, getPagedAccounts, getPagedTasks. Answer in 1-2 short markdown sentences from tool JSON only.}"
      OLLAMA_PROXY_TIMEOUT: ${OLLAMA_PROXY_TIMEOUT:-600000}
      MAX_TOOL_ROUNDS: ${OLLAMA_BRIDGE_MAX_TOOL_ROUNDS:-3}
    ports:
      - "${OLLAMA_BRIDGE_PORT:-8082}:8000"
    volumes:
      - ./${BRIDGE_MCP_CONFIG:-bridge-config.json}:/config/bridge-config.json:ro
    command: ["uv", "run", "ollama-mcp-bridge", "--config", "/config/bridge-config.json"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      dtime-mcp:
        condition: service_healthy
    healthcheck:
      # Unhealthy while MCP tools are not registered (tools: 0 → model hallucinates without DTime data).
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,json; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health')); exit(0 if d.get('tools',0)>0 else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 120s
    profiles:
      - ollama
      - full-stack
      - mcp
